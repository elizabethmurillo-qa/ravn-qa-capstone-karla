name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (All Browsers & Projects)
        run: npx playwright test

      - name: Claude PR Review with Browser Access
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.SECRET_KEY }}
          allowed_tools: "mcp__playwright__browser_snapshot,mcp__playwright__browser_click"
          mcp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": ["@playwright/mcp@latest"]
                }
              }
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accesibility-report
          path: ./accesibility-report/a11yReport/
          retention-days: 30
